services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: waze-churn-backend:local
    environment:
      WAZE_MODEL_PATH: /app/models/waze_churn_model.joblib
      WAZE_METADATA_PATH: /app/models/waze_churn_model_metadata.json
      WAZE_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: waze-churn-frontend:local
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
